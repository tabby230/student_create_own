<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics - NEX College of Arts and Science</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="header">
    <form action="students.html" method="get">
      <input type="text" name="search" placeholder="Search students">
      <button type="submit">Search</button>
    </form>
    <a class="logo" href="index.html"><img src="assets/images/logo.png" alt="">NEX College of Arts and Science</a>
  </div>

  <div class="menu">
    <a href="index.html">Home</a>
    <a href="students.html">Students</a>
    <a href="attendance.html">Attendance</a>
    <a href="departments.html">Departments</a>
    <a href="results.html">Results</a>
    <a href="analytics.html" class="active">Analytics</a>
  </div>

  <div class="page">

    <h1>Analytics</h1>
    <p class="subtitle">Attendance trend, department scores and grade distribution.</p>

    <div id="analyticsMessage" class="message error" style="display:none"></div>

    <div class="filters">
      <select id="anDept">
        <option value="All">All Departments</option>
      </select>
      <select id="anYear">
        <option value="All">All Years</option>
        <option value="1">1st Year</option>
        <option value="2">2nd Year</option>
        <option value="3">3rd Year</option>
        <option value="4">4th Year</option>
      </select>
    </div>

    <div class="box">
      <h3>Monthly Attendance</h3>
      <div style="height:280px"><canvas id="trendChart"></canvas></div>
    </div>

    <div class="box">
      <h3>Department Average Score</h3>
      <div style="height:280px"><canvas id="deptChart"></canvas></div>
    </div>

    <div class="box">
      <h3>Grade Distribution</h3>
      <table class="small" id="gradeTable">
        <thead>
          <tr><th>Grade</th><th class="num">Students</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

  </div>

  <div class="footer">
    NEX College of Arts and Science
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/analytics.js"></script>
</body>
</html>
