<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile - NEX College of Arts and Science</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="header">
    <form action="students.html" method="get">
      <input type="text" name="search" placeholder="Search students">
      <button type="submit">Search</button>
    </form>
    <a class="logo" href="index.html"><img src="assets/images/logo.png" alt="">NEX College of Arts and Science</a>
  </div>

  <div class="menu">
    <a href="index.html">Home</a>
    <a href="students.html" class="active">Students</a>
    <a href="attendance.html">Attendance</a>
    <a href="departments.html">Departments</a>
    <a href="results.html">Results</a>
    <a href="analytics.html">Analytics</a>
  </div>

  <div class="page">

    <p><a href="students.html">&laquo; Back to Students</a></p>

    <div id="profileMessage" class="message" style="display:none">Loading...</div>

    <div id="profile" style="display:none">

      <div class="box">
        <table class="small" style="border:0">
          <tr>
            <td style="border:0"><img id="photo" class="profile-photo" src="assets/images/logo.png" alt="Photo"></td>
            <td style="border:0">
              <h1 id="pName"></h1>
              <div id="pRoll"></div>
              <div id="pCourse"></div>
              <div id="pYearSem"></div>
              <p class="noprint">
                Change photo (max 2MB):
                <input type="file" id="photoInput" accept="image/jpeg,image/png,image/webp">
              </p>
            </td>
          </tr>
        </table>
      </div>

      <div class="tabs noprint" id="tabs">
        <button type="button" data-tab="overview" class="active">Overview</button>
        <button type="button" data-tab="academic">Academic</button>
        <button type="button" data-tab="attendance">Attendance</button>
        <button type="button" data-tab="results">Results</button>
        <button type="button" data-tab="documents">Documents</button>
      </div>

      <div class="box noprint" id="editBox" style="display:none">
        <h3 id="editTitle"></h3>
        <div id="editMessage" class="message error" style="display:none"></div>
        <form id="editForm"></form>
        <button type="button" class="main" id="editSave">Save</button>
        <button type="button" id="editCancel">Cancel</button>
      </div>

      <div id="tab-overview" class="tab-panel show"></div>
      <div id="tab-academic" class="tab-panel"></div>
      <div id="tab-attendance" class="tab-panel"></div>
      <div id="tab-results" class="tab-panel"></div>
      <div id="tab-documents" class="tab-panel"></div>
    </div>

  </div>

  <div class="footer">
    NEX College of Arts and Science
  </div>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/student-profile.js"></script>
</body>
</html>
